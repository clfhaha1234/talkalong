<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The AI Teacher · Prototype</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" />

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'EB Garamond', serif;
      background: #F6EFE0;
      color: #3B2A1A;
      overflow: hidden;
    }
    #app-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scaling stage — design size 1280×800, scale to fit viewport */
    .design-canvas-stage {
      position: relative;
      width: 1280px; height: 800px;
      flex-shrink: 0;
      transform-origin: center center;
      background: #F6EFE0;
    }
    /* fade transitions */
    .stage-fade {
      animation: stageFade 0.55s ease;
    }
    @keyframes stageFade { from { opacity: 0; } to { opacity: 1; } }

    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid #C77B6A; outline-offset: 2px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- illustrations (provides drawOn keyframes too) -->
  <script type="text/babel" src="illustrations.jsx"></script>
  <script type="text/babel" src="prototype-illustrations.jsx"></script>

  <!-- prototype pieces -->
  <script type="text/babel" src="prototype-shared.jsx"></script>
  <script type="text/babel" src="prototype-screens.jsx"></script>
  <script type="text/babel" src="prototype-story.jsx"></script>
</head>
<body>
  <div id="app-stage"></div>

  <script type="text/babel">
    const { useEffect, useState, useRef, useCallback } = React;

    function ScalingStage({ children }) {
      const stageRef = useRef(null);
      useEffect(() => {
        const fit = () => {
          const el = stageRef.current;
          if (!el) return;
          const sx = window.innerWidth / 1280;
          const sy = window.innerHeight / 800;
          const s = Math.min(sx, sy);
          el.style.transform = `scale(${s})`;
        };
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);
      return (
        <div ref={stageRef} className="design-canvas-stage">
          {children}
        </div>
      );
    }

    function App() {
      // stage: 'input' | 'loading' | 'story'
      const [stage, setStage] = useState('input');
      const [topic, setTopic] = useState('');

      const onBegin = useCallback((t) => {
        setTopic(t);
        setStage('loading');
      }, []);
      const onLoadingDone = useCallback(() => setStage('story'), []);
      const onExit = useCallback(() => setStage('input'), []);

      const { InputScreen, LoadingScreen, StoryScreen } = window.PrototypeScreens;

      return (
        <ScalingStage>
          <div key={stage} className="stage-fade" style={{ position: 'absolute', inset: 0 }}>
            {stage === 'input'   && <InputScreen onBegin={onBegin} />}
            {stage === 'loading' && <LoadingScreen onDone={onLoadingDone} />}
            {stage === 'story'   && <StoryScreen topic={topic} onExit={onExit} />}
          </div>
        </ScalingStage>
      );
    }

    function tryMount() {
      const ready = window.PrototypeScreens
        && window.PrototypeScreens.InputScreen
        && window.PrototypeScreens.LoadingScreen
        && window.PrototypeScreens.StoryScreen
        && window.RelativityIllustration
        && window.StoryTitleIllustration;
      if (ready) {
        ReactDOM.createRoot(document.getElementById('app-stage')).render(<App />);
      } else {
        setTimeout(tryMount, 30);
      }
    }
    tryMount();
  </script>
</body>
</html>
